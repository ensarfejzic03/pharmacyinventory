<!DOCTYPE html>
<html>
<head>
    <title>Add Medication</title>

    <style>
        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background-color: #eef6f8;
        }

        .header {
            background-color: #0b5c75;
            color: white;
            padding: 22px;
            text-align: center;
        }

        .nav {
            background-color: #08475c;
            padding: 13px;
            text-align: center;
        }

        .nav a {
            color: white;
            text-decoration: none;
            margin: 0 16px;
            font-weight: bold;
        }

        .nav a:hover {
            text-decoration: underline;
        }

        .container {
            width: 85%;
            margin: 30px auto;
        }

        .section-box {
            background-color: white;
            padding: 25px;
            border-radius: 10px;
            box-shadow: 0px 0px 10px rgba(0,0,0,0.15);
            margin-bottom: 30px;
        }

        .page-title {
            color: #0b5c75;
            margin-top: 0;
            margin-bottom: 5px;
        }

        .description {
            color: #555;
            margin-top: 0;
            margin-bottom: 20px;
        }

        .role-note {
            margin-bottom: 20px;
            background-color: #e8f4f8;
            padding: 12px;
            border-left: 5px solid #0b5c75;
            color: #444;
            border-radius: 5px;
        }

        .message {
            background-color: #e6f4ea;
            color: green;
            padding: 12px;
            border-radius: 6px;
            font-weight: bold;
            margin-bottom: 15px;
        }

        .error {
            background-color: #f8d7da;
            color: #842029;
            padding: 12px;
            border-radius: 6px;
            font-weight: bold;
            margin-bottom: 15px;
        }

        .form-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 15px;
        }

        .form-row {
            margin-bottom: 15px;
        }

        label {
            display: block;
            font-weight: bold;
            color: #333;
            margin-bottom: 6px;
        }

        input,
        select,
        textarea {
            width: 100%;
            padding: 12px;
            border: 1px solid #aaa;
            border-radius: 6px;
            box-sizing: border-box;
            font-size: 15px;
            font-family: Arial, sans-serif;
        }

        textarea {
            min-height: 90px;
            resize: vertical;
        }

        .btn {
            background-color: #0b5c75;
            color: white;
            padding: 11px 15px;
            border: none;
            border-radius: 5px;
            text-decoration: none;
            cursor: pointer;
            display: inline-block;
            font-size: 15px;
        }

        .btn:hover {
            background-color: #08475c;
        }

        .back-link {
            display: inline-block;
            margin-top: 12px;
            color: #0b5c75;
            font-weight: bold;
            text-decoration: none;
        }

        .back-link:hover {
            text-decoration: underline;
        }
    </style>
</head>

<body>

<div class="header">
    <h1>Pharmacy Medication Tracking System</h1>
</div>

<div class="nav">
    <a href="/dashboard">Dashboard</a>
    <a href="/medications">Medications</a>
    <a href="/inventory">Inventory</a>
    <a href="/transactions">Transactions</a>
    <a href="/alerts">Alerts</a>
    <a href="/reports" th:if="${role !='Technician'}">Reports</a>
    <a href="/logout">Logout</a>
</div>

<div class="container">

    <div class="role-note">
        Logged in as: <strong th:text="${role}"></strong>
    </div>

    <div class="section-box">

        <h2 class="page-title">Add New Medication</h2>

        <p class="description">
            Add medication details and create the initial inventory record for this medication.
        </p>

        <form action="/addMedication" method="post">

            <div class="form-grid">

                <div class="form-row">
                    <label for="medication_name">Medication Name</label>
                    <input
                            type="text"
                            id="medication_name"
                            name="medication_name"
                            placeholder="Example: Amoxicillin 500mg"
                            required>
                </div>

                <div class="form-row">
                    <label for="category">Category</label>
                    <input
                            type="text"
                            id="category"
                            name="category"
                            placeholder="Example: Antibiotic"
                            required>
                </div>

                <div class="form-row">
                    <label for="reorder_threshold">Reorder Threshold</label>
                    <input
                            type="number"
                            id="reorder_threshold"
                            name="reorder_threshold"
                            min="0"
                            placeholder="Example: 20"
                            required>
                </div>

                <div class="form-row">
                    <label for="supplier_id">Supplier</label>

                    <select id="supplier_id" name="supplier_id" required>
                        <option value="">Select supplier...</option>
                        <option
                            th:each="supplier : ${suppliers}"
                            th:value="${supplier.supplierID}"
                            th:text="${supplier.supplierName}"
                        </option>
                    </select>
                </div>

                <div class="form-row">
                    <label for="quantity">Initial Quantity</label>
                    <input
                            type="number"
                            id="quantity"
                            name="quantity"
                            min="0"
                            placeholder="Example: 50"
                            required>
                </div>

                <div class="form-row">
                    <label for="expiration_date">Expiration Date</label>
                    <input
                            type="date"
                            id="expiration_date"
                            name="expiration_date"
                            required>
                </div>

                <div class="form-row">
                    <label for="location">Storage Location</label>
                    <input
                            type="text"
                            id="location"
                            name="location"
                            placeholder="Example: Shelf A1"
                            required>
                </div>

            </div>

            <div class="form-row">
                <label for="description">Description</label>

                <textarea
                        id="description"
                        name="description"
                        placeholder="Enter medication description..."
                        required></textarea>
            </div>

            <button type="submit" class="btn">
                Add Medication
            </button>

        </form>

        <a href="/medications" class="back-link">
            Back to Medications
        </a>

    </div>

</div>

</body>
</html>
